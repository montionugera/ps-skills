name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-coverage:
    name: every test file runs in CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PyYAML and pytest
        run: pip install pyyaml pytest
      - name: Guard self-tests
        run: python3 -m pytest .github/scripts -v
      - name: Check no test file is left out of CI
        run: python3 .github/scripts/check_test_coverage.py

  engine:
    name: ps-release-workflow engine (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install engine (dev extras)
        working-directory: engine/ps-release-workflow
        run: pip install -e ".[dev]"
      - name: Run tests
        working-directory: engine/ps-release-workflow
        run: pytest -q -rs

  ps-commu-lifecycle:
    name: ps-commu-explain lifecycle (bash, macOS)
    runs-on: macos-latest          # scripts use BSD stat/lsof; run on macOS
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lifecycle test suite
        run: bash skills/ps-commu-explain/tests/lifecycle_test.sh

  ps-interactive-learning-builder:
    name: ps-interactive-learning-builder (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        run: python3 -m pytest skills/ps-interactive-learning-builder/tests -v

  ps-commu-react-template:
    name: ps-commu-explain React template builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the React tier template
        working-directory: skills/ps-commu-explain/assets/template-react
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

  vault-engine:
    name: vault-engine (go test + e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/vault-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/vault-engine/go.mod
          cache-dependency-path: tools/vault-engine/go.sum
      - name: Unit tests
        run: go test -cover ./...
      - name: E2E lifecycle
        run: ./test_e2e.sh

  dispatch-agy-worker:
    name: dispatch-agy-worker (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: pip install pytest
      # pytest, not `unittest discover`: tests/ mixes unittest classes with
      # pytest-style tests (fixtures/parametrize) that unittest never collects.
      - name: Run tests
        run: python3 -m pytest tests -v
