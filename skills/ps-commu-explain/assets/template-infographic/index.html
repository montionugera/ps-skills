<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Explainer Kit</title>

  <!-- Self-contained vendored fonts & cherry-markdown engine styles -->
  <link rel="stylesheet" href="./vendor/fonts.css" />
  <link rel="stylesheet" href="./vendor/cherry-markdown.markdown.min.css" />

  <!-- design lock + components (local; must be SERVED, not file://) -->
  <link rel="stylesheet" href="./theme.css" />
  <link rel="stylesheet" href="./explainer.css" />

  <style>
    /* minimal boot styling only — real styling lives in explainer.css */
    #app { min-height: 60vh; }
    .booting {
      position: relative; z-index: 2;
      max-width: var(--maxw); margin: 0 auto; padding: var(--space-8) var(--space-6);
      font-family: var(--font-mono); font-size: var(--fs-sm);
      letter-spacing: var(--track-label); text-transform: var(--tt-label); color: var(--ink-dim);
    }
    html[lang^="th"] .booting { letter-spacing: 0; text-transform: none; }
  </style>
</head>
<body>
  <div id="app"><div class="booting">Loading explainer…</div></div>

  <!-- Pre-define MathJax + offline draw.io globals BEFORE loading vendor scripts
       so neither viewer-static.min.js (Editor.initMath) nor cherry-markdown
       attempts any runtime request to viewer.diagrams.net or math CDNs. -->
  <script>
    window.MathJax = { typeset: function () {}, startup: {} };
    window.mxLoadResources = false;
    window.DRAWIO_BASE_URL = ".";
  </script>
  <script src="./vendor/viewer-static.min.js"></script>
  <script src="./vendor/cherry-markdown.engine.core.js"></script>
  <script src="./vendor/lucide.min.js"></script>
  <script src="./cherry-setup.js"></script>

  <script>
    (function () {
      "use strict";

      var KNOWN_DOCS = ["content.md", "components.md"];

      function qparam(name) {
        return new URLSearchParams(window.location.search).get(name);
      }

      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function showError(title, detail, doc) {
        var links = KNOWN_DOCS.map(function (d) {
          return '<li><a href="?doc=' + encodeURIComponent(d) + '"><code>' + esc(d) + "</code></a></li>";
        }).join("");
        document.getElementById("app").innerHTML =
          '<div class="explainer-error">' +
          '<div class="eyebrow">Explainer Kit — cannot render</div>' +
          "<h1>" + esc(title) + "</h1>" +
          "<p>" + esc(detail) + "</p>" +
          (doc ? "<p>Requested doc: <code>" + esc(doc) + "</code></p>" : "") +
          "<p>Available example documents:</p><ul>" + links + "</ul>" +
          '<p style="color:var(--ink-dim)">This kit must be <strong>served</strong> ' +
          "(<code>./serve.sh</code>), never opened as a bare <code>file://</code> URL — " +
          "browsers block <code>fetch()</code> of local files under CORS.</p>" +
          "</div>";
      }

      function resolveEngine() {
        if (window.CherryEngine && window.CherryEngine.default) return window.CherryEngine.default;
        if (window.Cherry && window.Cherry.default) return window.Cherry.default;
        return window.CherryEngine || window.Cherry;
      }

      function boot() {
        var doc = qparam("doc") || "content.md";

        if (!/^[\w.\-]+\.md$/.test(doc)) {
          showError("Invalid document name", "The ?doc value must be a plain *.md filename in the kit folder.", doc);
          return;
        }
        var CherryCtor = resolveEngine();
        if (typeof CherryCtor !== "function") {
          showError("Engine failed to load", "cherry-markdown engine did not load from ./vendor/.", doc);
          return;
        }
        if (typeof GraphViewer === "undefined") {
          showError("Diagram engine failed to load", "draw.io viewer did not load from ./vendor/. Diagrams cannot render.", doc);
          return;
        }

        fetch("./" + doc, { cache: "no-cache" })
          .then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.text();
          })
          .then(
            function (md) {
              document.getElementById("app").innerHTML = '<div id="container"></div>';
              try {
                window.renderExplainer("container", md);
              } catch (renderErr) {
                showError(
                  "Engine failed to render",
                  "The document loaded but the render engine threw while rendering it (" +
                    renderErr.message + ").",
                  doc
                );
              }
            },
            function (fetchErr) {
              showError(
                "Document not found",
                "Could not fetch the requested markdown (" + fetchErr.message + ").",
                doc
              );
            }
          );
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
